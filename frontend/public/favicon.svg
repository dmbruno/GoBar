<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="white"/>

  <!-- Mailbox post -->
  <rect x="43" y="65" width="14" height="20" fill="#8B4513" rx="2"/>

  <!-- Mailbox body -->
  <rect x="25" y="40" width="50" height="30" fill="#DC143C" rx="4"/>

  <!-- Mailbox curved top -->
  <path d="M 25 40 Q 25 30 50 28 Q 75 30 75 40" fill="#DC143C" stroke="#a00a2e" stroke-width="1.5"/>

  <!-- Mailbox door -->
  <rect x="27" y="42" width="46" height="18" fill="#FF6B6B" rx="2" stroke="#a00a2e" stroke-width="1"/>

  <!-- Door handle -->
  <circle cx="71" cy="51" r="2.5" fill="#333333"/>

  <!-- Flag -->
  <rect x="76" y="48" width="2" height="6" fill="#333333"/>
  <rect x="76" y="48" width="10" height="6" fill="#FFD700" rx="1"/>

  <!-- Mail inside (hint of envelope) -->
  <rect x="32" y="47" width="36" height="8" fill="white" stroke="#333333" stroke-width="1" rx="1"/>
</svg>